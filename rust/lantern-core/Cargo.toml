[package]
name = "lantern-core"
version = "1.7.0"
edition = "2021"
license = "GPL-3.0"
description = "Lantern's Rust core: AI provider requests and streaming, theme palettes, settings validation, omnibox ranking, mail links and QR codes. Compiled to WebAssembly and loaded by the Electron main process."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { version = "1", default-features = false, features = ["std"] }
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
