<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: crx: lantern:; font-src 'self'">
<title>Lantern</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
  <div id="strip" class="strip">
    <div id="tabs" class="tabs" role="tablist" aria-label="Tabs"></div>
    <button id="newtab" class="newtab" title="New tab" aria-label="New tab">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
    </button>
    <div class="drag-fill"></div>
    <span id="private-badge" class="private-badge" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9h14M5 9l1.4-4.2a1 1 0 0 1 1-.7h5.2a1 1 0 0 1 1 .7L15 9"/><circle cx="6.5" cy="13" r="2.3"/><circle cx="13.5" cy="13" r="2.3"/><path d="M8.8 13h2.4"/></svg>
      Private
    </span>
  </div>

  <div class="toolbar">
    <button id="back" class="tb" title="Back" aria-label="Back"><svg viewBox="0 0 20 20"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg></button>
    <button id="forward" class="tb" title="Forward" aria-label="Forward"><svg viewBox="0 0 20 20"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg></button>
    <button id="reload" class="tb" title="Reload" aria-label="Reload">
      <svg class="i-reload" viewBox="0 0 20 20"><path d="M15.5 10a5.5 5.5 0 1 1-1.7-4"/><path d="M14.5 3v3.5H11"/></svg>
      <svg class="i-stop" viewBox="0 0 20 20"><path d="M5 5l10 10M15 5 5 15"/></svg>
    </button>
    <button id="home" class="tb" title="Home" aria-label="Home"><svg viewBox="0 0 20 20"><path d="M4 9.5 10 4.5l6 5V16H12v-4H8v4H4z"/></svg></button>

    <form id="omni" class="omni" autocomplete="off">
      <span id="status" class="status" aria-hidden="true"></span>
      <input id="address" spellcheck="false" aria-label="Search or enter address">
      <button id="zoom" type="button" class="zoom-pill" title="Reset zoom" hidden>100%</button>
      <span id="shield" class="shield" title="Trackers blocked on this page" hidden>
        <svg viewBox="0 0 20 20"><path d="M10 2.5 4 5v4.5c0 3.8 2.6 6.9 6 8 3.4-1.1 6-4.2 6-8V5z"/></svg>
        <span id="blocked">0</span>
      </span>
      <button id="summary" type="button" class="summary-toggle" aria-pressed="false" title="Show summaries on Lantern Search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l1.6 4.4 4.4 1.6-4.4 1.6L10 14.5l-1.6-4.4L4 8.5l4.4-1.6z"/><path d="M15.5 13.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        <span>Summary</span>
      </button>
      <button id="star" type="button" class="star" title="Bookmark this tab" aria-label="Bookmark this tab" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 3 2.1 4.4 4.8.6-3.5 3.3.9 4.7L10 13.7 5.7 16l.9-4.7L3.1 8l4.8-.6z"/></svg>
      </button>
    </form>

    <form id="findbar" class="findbar" hidden autocomplete="off">
      <input id="findtext" aria-label="Find on page" placeholder="Find on page">
      <span id="findcount" class="count" aria-live="polite"></span>
      <button type="button" id="findprev" class="tb" aria-label="Previous match"><svg viewBox="0 0 20 20"><path d="M5 12.5 10 7.5l5 5"/></svg></button>
      <button type="button" id="findnext" class="tb" aria-label="Next match"><svg viewBox="0 0 20 20"><path d="M5 7.5 10 12.5l5-5"/></svg></button>
      <button type="button" id="findclose" class="tb" aria-label="Close find bar"><svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5 5 15"/></svg></button>
    </form>

    <browser-action-list id="actions" alignment="bottom left"></browser-action-list>
    <button id="downloads" class="tb" title="Downloads" aria-label="Downloads" hidden>
      <svg viewBox="0 0 20 20"><path d="M10 3.5v9M6 9l4 4 4-4M4.5 16h11"/></svg>
      <svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15"/></svg>
    </button>
    <div id="ai" class="ai-btn" role="group" aria-label="AI assistant">
      <button id="ai-open" type="button" class="ai-main" title="AI assistant" aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l1.6 4.4 4.4 1.6-4.4 1.6L10 14.5l-1.6-4.4L4 8.5l4.4-1.6z"/><path d="M15.5 13.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
        <span id="ai-name">AI</span>
      </button>
      <button id="ai-pick" type="button" class="ai-pick" title="Choose AI service and keys" aria-label="Choose AI service">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
      </button>
    </div>
    <button id="profile" class="avatar" title="Profile" aria-label="Profile"><span id="initial">P</span></button>
    <button id="menu" class="tb" title="Menu" aria-label="Menu"><svg viewBox="0 0 20 20"><circle cx="10" cy="4.5" r="1.4"/><circle cx="10" cy="10" r="1.4"/><circle cx="10" cy="15.5" r="1.4"/></svg></button>
  </div>

  <nav id="bmbar" class="bmbar" aria-label="Bookmarks" hidden>
    <div id="bm-items" class="bm-items"></div>
    <button id="bm-more" type="button" class="bm-more" title="All bookmarks" hidden>
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 5 12.5 10l-5 5"/></svg>
    </button>
  </nav>

  <script src="theme.js"></script>
  <script src="ui.js"></script>
</body>
</html>
